services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./parser:/app/parser
    environment:
      # Имена сервисов ниже ("mongo", "redis") резолвятся только внутри сети
      # compose -- в контейнере backend это правильные адреса, снаружи они
      # были бы недоступны.
      - MONGO_URI=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
    # Ключи LLM и (опционально) свой JWT_SECRET -- см. .env.example.
    # required: false -- без .env сервис всё равно поднимется: текстовое
    # редактирование ответит понятной ошибкой, а не упадёт весь compose;
    # JWT_SECRET без .env возьмёт дев-заглушку из auth.py (не для реального
    # многопользовательского запуска, но регистрация/вход при этом работают).
    env_file:
      - path: .env
        required: false
    depends_on:
      # service_healthy, а не просто "контейнер запущен": даёт mongo/redis
      # реальный шанс принять первое подключение до первого запроса к
      # backend, а не полагается сразу на fail-open деградацию (db.py/
      # cache.py) -- та остаётся страховкой на случай, если mongo/redis
      # упадут уже ПОСЛЕ старта, а не заменяет нормальный порядок запуска.
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # Без внешних утилит (curl/wget нет в python:3.12-slim) -- достаточно
      # самого Python из образа.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Аккаунты и проекты пользователей (db.py, projects.py) -- по условию
  # задачи. Сам редактор (DXF/генерация/правка текстом) от неё не зависит и
  # продолжает работать, даже если этот сервис не поднят (см. db.py: ошибка
  # подключения не роняет backend, только эндпоинты /api/auth и /api/projects).
  mongo:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Ограничение частоты входа/регистрации, кэш каталога и реестр активных
  # сессий по refresh-токенам (cache.py) -- тоже необязателен для запуска:
  # без него аккаунты работают как раньше, просто без лимита на попытки
  # входа, без кэша каталога и без мгновенного отзыва сессии при logout
  # (см. cache.py -- сессия в этом случае считается активной по одной лишь
  # подписи JWT).
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Резолвится в браузере пользователя, а не внутри контейнера -- поэтому
      # localhost:8000 работает, пока backend публикует порт на хост (см. выше).
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1, а не localhost -- у wget в этом образе localhost сначала
      # резолвится в ::1, а vite dev server даже с --host 0.0.0.0 не всегда
      # слушает IPv6-loopback (проверено вручную: обращение к localhost внутри
      # контейнера получало "connection refused", хотя сам сервер уже поднят
      # и снаружи доступен нормально).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s  # npm install уже сделан в образе, но vite dev server поднимается не мгновенно
    restart: unless-stopped

  # --- Наблюдаемость (метрики + логи) -----------------------------------
  # По требованию проекта поднимаются вместе со всем остальным одной и той
  # же командой `docker compose up --build` -- не отдельным профилем.
  # backend работает независимо от них (GET /metrics и JSON-логи в stdout
  # пишутся в любом случае, см. observability/README.md), поэтому падение
  # или временная недоступность одного из этих четырёх сервисов не мешает
  # редактору, но по умолчанию поднимается весь проект целиком.

  # Собирает GET /metrics с backend (стандартные HTTP-метрики +
  # бизнес-метрики из backend/metrics.py, см. observability/prometheus/).
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Хранилище логов -- backend пишет структурированные JSON-строки в stdout
  # (backend/logging_config.py), promtail ниже их сюда доставляет.
  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    ports:
      - "3100:3100"
    healthcheck:
      # /ready отвечает 503, пока однобинарный instance не присоединится к
      # своему (in-memory) ring'у -- на практике занимает ~15-20 с, отсюда
      # длинный start_period: без него healthcheck пометил бы контейнер
      # unhealthy ещё до того, как Loki реально успел бы стать готовым.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

  # Собирает логи ВСЕХ контейнеров compose через Docker API и отправляет в
  # loki -- ничего не нужно менять в самих сервисах (никакого
  # logging-драйвера здесь), см. observability/promtail/promtail-config.yml.
  # Сокет докера -- только для чтения, promtail лишь читает список
  # контейнеров и их логи, ничем не управляет.
  promtail:
    image: grafana/promtail:3.3.2
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      # Ни wget, ни curl в этом образе нет (в отличие от остальных трёх) --
      # достаточно самого TCP-подключения к его же HTTP-порту (server.http_
      # listen_port в promtail-config.yml): открывается только после того,
      # как процесс реально поднял сервер, bash с /dev/tcp есть в образе.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/9080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Дашборды -- источники данных (Prometheus + Loki) и сами дашборды
  # подключаются автоматически при первом старте через провижининг (см.
  # observability/grafana/provisioning/), руками в UI ничего добавлять не
  # нужно. GF_SECURITY_ADMIN_PASSWORD -- дефолт для локального стенда/демо,
  # поменять перед любым запуском не только на своей машине.
  grafana:
    image: grafana/grafana:11.4.0
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  mongo_data:
  prometheus_data:
  loki_data:
  grafana_data:
