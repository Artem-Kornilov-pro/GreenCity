services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
      - ./parser:/app/parser
    # Ключи LLM. required: false -- без .env сервис всё равно поднимется, просто
    # текстовое редактирование ответит понятной ошибкой, а не упадёт весь compose.
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Резолвится в браузере пользователя, а не внутри контейнера -- поэтому
      # localhost:8000 работает, пока backend публикует порт на хост (см. выше).
      - VITE_API_BASE=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
