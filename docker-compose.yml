# Наружу опубликованы только фронтенд (5173) и Grafana (3001). Бэкенд,
# MongoDB, Redis, Prometheus и Loki доступны лишь внутри сети compose: браузер
# обращается к API через dev-сервер фронтенда (он проксирует /api и Swagger на
# backend:8000), поэтому CORS на бэкенде выключен.
#
# Запуск у проверяющих -- на любой машине с Docker и Compose v2, без правки
# этого файла:
#   - настройки -- только из .env (необязательного): docker compose сам
#     подставляет его значения в ${...} ниже, без .env берутся значения по
#     умолчанию;
#   - порты, образ MongoDB, путь к сокету Docker меняются переменными
#     (.env.example, раздел «Запуск в Docker»);
#   - :z у смонтированных каталогов -- метка SELinux (РЕД ОС, Fedora, CentOS),
#     без неё контейнер не может их читать; на остальных системах ни на что
#     не влияет.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    # Порт не публикуется: бэкенд доступен только из сети compose.
    expose:
      - "8000"
    volumes:
      - ./backend:/app/backend:z
      - ./parser:/app/parser:z
      # Корпус GreenPlan (locations/, data/pattern_corpus.yaml) и нормы --
      # только чтение.
      - ./locations:/app/locations:ro,z
      - ./data:/app/data:ro,z
      # Исходные чертежи загрузок (backend/exchange/source_store.py): экспорт
      # дописывает слои результата в них -- том, чтобы они переживали
      # перезапуск и пересборку контейнера.
      - sources_data:/app/var/sources
    environment:
      # Имена сервисов ниже ("mongo", "redis") резолвятся только внутри сети
      # compose -- в контейнере backend это правильные адреса, снаружи они
      # были бы недоступны.
      - MONGO_URI=mongodb://mongo:27017
      - REDIS_URL=redis://redis:6379/0
      - GREENCITY_SOURCES_DIR=/app/var/sources
      # 1 -- дев-режим: один процесс с --reload, правки подхватываются на лету
      # (см. развилку в backend/Dockerfile). Поднимать имеет смысл под реальную
      # нагрузку: геометрия на shapely упирается в GIL, и несколько запросов к
      # /api/generate-greenery в одном процессе не считаются параллельно, а
      # делят одно ядро. 4 -- разумная отправная точка, ценой потери --reload.
      # Через переменную окружения, чтобы не править файл ради одного прогона:
      #     UVICORN_WORKERS=4 docker compose up -d backend
      - UVICORN_WORKERS=${UVICORN_WORKERS:-1}
      # Дев-режим: --reload (при UVICORN_WORKERS=1). Продакшен --
      # docker-compose.prod.yml, там 0.
      - UVICORN_RELOAD=${UVICORN_RELOAD:-1}
      # Swagger (/docs) -- в дев-режиме открыт через фронтенд:
      # http://localhost:5173/docs. В продакшене выключен.
      - API_DOCS=${API_DOCS:-1}
      # Настройки из .env (см. .env.example). Через подстановку, а не
      # env_file: «env_file: path/required» есть только в Compose 2.24+, а на
      # более старом файл не проходил проверку и не запускалось ничего.
      # Незаданная переменная приходит пустой -- бэкенд считает пустое
      # значение незаданным. Без ключа LLM текстовое редактирование отвечает
      # понятной ошибкой, без JWT_SECRET -- дев-заглушка из auth.py.
      # Новая настройка бэкенда добавляется и в этот список.
      - LLM_PROVIDER=${LLM_PROVIDER:-}
      - YANDEX_CLOUD_API_KEY=${YANDEX_CLOUD_API_KEY:-}
      - YANDEX_CLOUD_FOLDER=${YANDEX_CLOUD_FOLDER:-}
      - YANDEX_CLOUD_MODEL=${YANDEX_CLOUD_MODEL:-}
      - YANDEX_CLOUD_REPORT_MODEL=${YANDEX_CLOUD_REPORT_MODEL:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - LOG_LEVEL=${LOG_LEVEL:-}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-}
      - FORWARDED_ALLOW_IPS=${FORWARDED_ALLOW_IPS:-}
      - RATE_LIMIT_MULTIPLIER=${RATE_LIMIT_MULTIPLIER:-}
      - MAX_UPLOAD_MB=${MAX_UPLOAD_MB:-}
      - MAX_BODY_MB=${MAX_BODY_MB:-}
      - MAX_DWG_FILES=${MAX_DWG_FILES:-}
      - HEAVY_CONCURRENCY=${HEAVY_CONCURRENCY:-}
      - HEAVY_QUEUE_MAX=${HEAVY_QUEUE_MAX:-}
      - HEAVY_WAIT_S=${HEAVY_WAIT_S:-}
      - DWG_MAX_PARALLEL=${DWG_MAX_PARALLEL:-}
      - DWG_WORKERS=${DWG_WORKERS:-}
    depends_on:
      # service_started, а не service_healthy: бэкенд не ждёт базу. Редактор,
      # GreenPlan и экспорт от MongoDB и Redis не зависят (db.py и cache.py
      # переживают их отсутствие), а mongo:7 на процессоре без AVX (старые
      # x86, виртуальные машины с типом процессора kvm64) не стартует вовсе --
      # с service_healthy из-за этого не поднимался и весь сайт. Индексы
      # базы бэкенд создаёт, когда она станет доступна (db.ensure_indexes_
      # when_available).
      mongo:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      # Без внешних утилит (curl/wget нет в python:3.12-slim) -- достаточно
      # самого Python из образа.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Аккаунты и проекты пользователей (db.py, projects.py) -- по условию
  # задачи. Сам редактор (DXF/генерация/правка текстом) от неё не зависит и
  # продолжает работать, даже если этот сервис не поднят (см. db.py: ошибка
  # подключения не роняет backend, только эндпоинты /api/auth и /api/projects).
  mongo:
    # mongo:7 требует AVX. На процессоре без него (mongod падает с «Illegal
    # instruction») -- MONGO_IMAGE=mongo:4.4 в .env: это последняя версия без
    # AVX, драйвер бэкенда её поддерживает.
    image: ${MONGO_IMAGE:-mongo:7}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      # mongosh -- полноценный Node.js-процесс, не лёгкий пинг: на interval 5s
      # это ~17 тыс. запусков mongosh за сутки работы и заметный фоновый CPU у
      # контейнера почти без реальной нагрузки. 10s -- как у всех остальных
      # сервисов ниже (единственное реальное отличие -- вдвое медленнее
      # обнаружение падения, для дев-стенда это не критично). В mongo:4.4
      # клиент называется mongo, а не mongosh.
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\")' || mongo --quiet --eval 'db.adminCommand(\"ping\")'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Ограничение частоты входа/регистрации, кэш каталога и реестр активных
  # сессий по refresh-токенам (cache.py) -- тоже необязателен для запуска:
  # без него аккаунты работают как раньше, просто без лимита на попытки
  # входа, без кэша каталога и без мгновенного отзыва сессии при logout
  # (см. cache.py -- сессия в этом случае считается активной по одной лишь
  # подписи JWT).
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Порт на машине -- FRONTEND_PORT, если 5173 занят.
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app:z
      - /app/node_modules
    environment:
      # Браузер обращается к API по относительным путям /api/..., dev-сервер
      # vite проксирует их на бэкенд внутри сети compose (frontend/vite.config.ts).
      - VITE_API_BASE=
      - API_PROXY_TARGET=http://backend:8000
      # Открывать сайт можно по любому имени машины (http://сервер:5173), а
      # не только по localhost и IP: иначе vite отвечает «Blocked request».
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-all}
    depends_on:
      - backend
    healthcheck:
      # 127.0.0.1, а не localhost -- у wget в этом образе localhost сначала
      # резолвится в ::1, а vite dev server даже с --host 0.0.0.0 не всегда
      # слушает IPv6-loopback (проверено вручную: обращение к localhost внутри
      # контейнера получало "connection refused", хотя сам сервер уже поднят
      # и снаружи доступен нормально).
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:5173"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s  # npm install уже сделан в образе, но vite dev server поднимается не мгновенно
    restart: unless-stopped
    # Долгоживущий dev-сервер vite/esbuild за многочасовую сессию с частыми
    # правками и HMR постепенно раздувается (измерено: 1.4 ГБ после суток
    # работы, при том что сразу после старта с ТЁПЛЫМ кешем esbuild --
    # ~150-200 МБ) -- это кеш модулей и трансформаций esbuild, а не утечка в
    # коде проекта, и сам процесс его не подчищает. Явный потолок памяти
    # вместо ручного docker compose restart: при достижении контейнер падает
    # по OOM, а restart: unless-stopped выше поднимает его заново с чистого
    # состояния. Код и правки не теряются -- всё в смонтированном volume, а
    # не в памяти процесса; пользователь в браузере увидит только короткий
    # разрыв HMR-сокета, vite-клиент переподключается сам.
    #
    # 2g, не 1g: на ХОЛОДНОМ старте (пустой .vite-кеш, например после
    # --renew-anon-volumes) сама первичная оптимизация зависимостей --
    # three.js/@react-three/fiber/@react-three/drei/radix/framer-motion, пак
    # немаленький -- измерено потребляет ~911 МБ САМА ПО СЕБЕ, ещё до первого
    # реального запроса. Лимит 1g был впритык к этому пику: любой чих (HMR,
    # GC) продавливал OOM прямо во время старта, и контейнер уходил в
    # бесконечный restart-loop, ни разу не поднявшись -- проверено вживую.
    mem_limit: 2g

  # --- Наблюдаемость (метрики + логи) -----------------------------------
  # По требованию проекта поднимаются вместе со всем остальным одной и той
  # же командой `docker compose up --build` -- не отдельным профилем.
  # backend работает независимо от них (GET /metrics и JSON-логи в stdout
  # пишутся в любом случае, см. observability/README.md), поэтому падение
  # или временная недоступность одного из этих четырёх сервисов не мешает
  # редактору, но по умолчанию поднимается весь проект целиком.

  # Собирает GET /metrics с backend (стандартные HTTP-метрики +
  # бизнес-метрики из backend/monitoring/metrics.py, см. observability/prometheus/).
  prometheus:
    image: prom/prometheus:v3.0.1
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus_data:/prometheus
    # Порт не публикуется: Prometheus читает Grafana внутри сети compose.
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Хранилище логов -- backend пишет структурированные JSON-строки в stdout
  # (backend/monitoring/logging_config.py), promtail ниже их сюда доставляет.
  loki:
    image: grafana/loki:3.3.2
    command: -config.file=/etc/loki/loki-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro,z
      - loki_data:/loki
    # Порт не публикуется: логи пишет Promtail и читает Grafana внутри сети compose.
    healthcheck:
      # /ready отвечает 503, пока однобинарный instance не присоединится к
      # своему (in-memory) ring'у -- на практике занимает ~15-20 с, отсюда
      # длинный start_period: без него healthcheck пометил бы контейнер
      # unhealthy ещё до того, как Loki реально успел бы стать готовым.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    restart: unless-stopped

  # Собирает логи ВСЕХ контейнеров compose через Docker API и отправляет в
  # loki -- ничего не нужно менять в самих сервисах (никакого
  # logging-драйвера здесь), см. observability/promtail/promtail-config.yml.
  # Сокет докера -- только для чтения, promtail лишь читает список
  # контейнеров и их логи, ничем не управляет. Логи он берёт через Docker
  # API (docker_sd_configs), поэтому каталог /var/lib/docker/containers хоста
  # не нужен: его нет у Docker без root, Podman, Colima. Сокет в другом
  # месте (Docker без root: /run/user/1000/docker.sock) -- DOCKER_SOCKET в
  # .env. Без сокета не будет только логов в Grafana, сайт работает.
  promtail:
    image: grafana/promtail:3.3.2
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro,z
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    healthcheck:
      # Ни wget, ни curl в этом образе нет (в отличие от остальных трёх) --
      # достаточно самого TCP-подключения к его же HTTP-порту (server.http_
      # listen_port в promtail-config.yml): открывается только после того,
      # как процесс реально поднял сервер, bash с /dev/tcp есть в образе.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/9080"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Дашборды -- источники данных (Prometheus + Loki) и сами дашборды
  # подключаются автоматически при первом старте через провижининг (см.
  # observability/grafana/provisioning/), руками в UI ничего добавлять не
  # нужно. Пароль admin -- для локального стенда/демо; перед любым запуском
  # не только на своей машине задайте GRAFANA_ADMIN_PASSWORD в .env.
  grafana:
    image: grafana/grafana:11.4.0
    ports:
      # Порт на машине -- GRAFANA_PORT, если 3001 занят.
      - "${GRAFANA_PORT:-3001}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./observability/grafana/dashboards:/etc/grafana/dashboards:ro,z
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  mongo_data:
  sources_data:
  prometheus_data:
  loki_data:
  grafana_data:
