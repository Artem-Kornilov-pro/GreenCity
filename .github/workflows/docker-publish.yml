name: Publish Docker images

# Только после мержа в main (не на каждый PR -- иначе Packages засорялись бы
# промежуточными образами из веток, которые никто разворачивать не будет).
# CI (ci.yml) на самом PR уже проверяет, что оба образа вообще собираются --
# здесь их же собираем заново и публикуем, раз проверка была зелёной.
# Тег релиза (v1.0.0) публикует образы ещё и с номером версии (:1.0.0).
on:
  push:
    branches: [main]
    tags: ["v*"]

# packages: write -- без этого GITHUB_TOKEN не может публиковать в
# ghcr.io этого репозитория (contents: read достаточно для checkout).
permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          # backend собирается из корня репозитория (context: .), не из
          # backend/ -- см. комментарий в самом backend/Dockerfile: main.py
          # импортирует parser/parse_dxf.py по относительному пути, оба
          # каталога должны попасть в контекст сборки одним и тем же образом.
          - image: backend
            context: .
            dockerfile: backend/Dockerfile
          # Продакшен-образ: статическая сборка за nginx (Dockerfile.prod),
          # а не дев-режим vite dev server из frontend/Dockerfile.
          - image: frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile.prod
    steps:
      - uses: actions/checkout@v5

      # ghcr.io не принимает заглавные буквы в имени образа, а репозиторий
      # называется "GreenCity" -- без этого шага push просто откажет по имени тега.
      - name: Имя репозитория в нижнем регистре
        run: echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Теги образа: для main -- latest и sha коммита, для тега релиза --
      # номер версии без «v» и sha.
      - name: Теги образа
        run: |
          IMAGE="ghcr.io/${REPO_LC}-${{ matrix.image }}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "IMAGE_TAGS=${IMAGE}:${GITHUB_REF_NAME#v},${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          else
            echo "IMAGE_TAGS=${IMAGE}:latest,${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_ENV"
          fi

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.IMAGE_TAGS }}
