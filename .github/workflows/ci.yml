name: CI

# На каждый PR в main и на сам main после мержа -- вместе с branch protection
# (Settings -> Branches -> main: "Require a pull request before merging" +
# "Require status checks to pass" с этими джобами) это и даёт "коммиты в main
# только через PR с зелёным CI".
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # requirements-dev.txt сам подключает requirements.txt (-r requirements.txt)
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx oxlint --deny-warnings
      # Проверка типов TypeScript -- oxlint её не делает, а сборка фронтенда
      # в CI не запускается; без этого шага ошибка типов доезжала до main.
      - working-directory: frontend
        run: npx tsc -b --noEmit

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # Полностью офлайн (MongoDB/Redis подменены mongomock/fakeredis, LLM не
      # вызывается ни разу -- см. backend/tests/conftest.py и
      # test_llm_editor_request.py) -- секреты в этой джобе не нужны и не
      # передаются, тесты идут одинаково и для форков, и для PR из них.
      - run: pytest --cov --cov-report=term-missing

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Только backend и frontend собираются из исходников (Dockerfile) --
      # mongo/redis/prometheus/loki/promtail/grafana берутся готовыми
      # образами, docker compose build их не трогает вовсе.
      - name: Собрать образы backend и frontend
        run: docker compose build

      # Продакшен-вариант: образ фронтенда (статика за nginx) -- его же
      # публикует docker-publish.yml -- и итоговая конфигурация
      # docker-compose.yml + docker-compose.prod.yml.
      - name: Собрать продакшен-образ фронтенда
        run: docker build -f frontend/Dockerfile.prod frontend
      - name: Проверить продакшен-конфигурацию docker compose
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

      # Полная проверка: реально поднять весь стек (все восемь сервисов, тот
      # же docker-compose.yml, что и у разработчика) и дождаться, что каждый
      # прошёл свой healthcheck -- не только "образ собрался", а "проект
      # реально стартует и работает". .env не нужен: JWT_SECRET берёт
      # дев-заглушку (auth.py), LLM недоступна и отвечает понятной ошибкой --
      # оба случая уже штатно обработаны кодом, не CI-специфичный костыль.
      # docker compose up сам по себе не повторяет попытку -- если реестр
      # образов (Docker Hub) на секунду оборвал соединение при скачивании
      # готового образа (mongo/redis/prometheus/loki/promtail/grafana), вся
      # джоба падает, хотя к коду PR это отношения не имеет (см. README про
      # authentication required/toomanyrequests -- тот же класс временного
      # сбоя реестра, здесь просто connection reset). docker compose down -v
      # между попытками -- чтобы повтор стартовал с чистого состояния, а не
      # наткнулся на уже частично поднятые контейнеры прошлой попытки.
      - name: Поднять весь стек
        run: |
          for attempt in 1 2 3; do
            if docker compose up -d; then
              exit 0
            fi
            echo "::warning::docker compose up упал (попытка $attempt/3) -- похоже на временный сбой реестра образов, не код проекта"
            docker compose down -v || true
            sleep 15
          done
          echo "::error::docker compose up не поднялся за 3 попытки"
          exit 1

      - name: Дождаться healthy всех сервисов
        run: |
          for i in $(seq 1 40); do
            unhealthy=0
            for c in $(docker compose ps -q); do
              h=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$c")
              if [ "$h" != "healthy" ] && [ "$h" != "none" ]; then
                unhealthy=1
              fi
            done
            if [ "$unhealthy" -eq 0 ]; then
              echo "Все сервисы healthy"
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          echo "::error::Не все сервисы стали healthy за отведённое время"
          docker compose ps
          docker compose logs
          exit 1

      - name: Логи (для разбора при падении джобы)
        if: failure()
        run: docker compose logs

      - name: Остановить стек
        if: always()
        run: docker compose down -v
