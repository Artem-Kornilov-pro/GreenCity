# Автоматически подключает Prometheus и Loki при первом старте Grafana --
# руками добавлять источники данных через UI не нужно (см.
# docker-compose.yml: volume examples наружу этот файл, а не GF_* env-переменные,
# datasource -- не одно значение, а структура, YAML-провижининг для этого и
# существует в Grafana).
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus_ds
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki_ds
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
