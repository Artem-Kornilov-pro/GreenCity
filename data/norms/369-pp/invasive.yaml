# ВНИМАНИЕ: ПЕРЕЧЕНЬ НЕПОЛНЫЙ.
#
# Постановление вводит 32 вида, разбитых на 4 группы. Полный текст достать не
# удалось -- ниже только виды, названные во вторичных источниках, и структура
# групп. Использовать как чёрный список в таком виде НЕЛЬЗЯ: отсутствие вида в
# этом файле сейчас не означает, что он разрешён.
#
# Достать: полный текст 369-ПП с приложением 1 ("Перечень инвазивных видов
# растений..."). Проверено 2026-09-23: garant.ru/hotlaw/moscow/2017719 и
# consultant.ru дают только анонс, в открытых статьях названы те же ~11 видов.
# Официальный текст есть на mos.ru (из нашей среды сертификат сайта не
# проверяется) -- его нужно скачать вручную из браузера и перенести сюда
# группу 3 целиком: именно она запрещает высадку, от неё зависит подбор видов
# GreenPlan (issue #59).

status: неполный -- известно 11 названий из 32 видов

# Размер групп -- по пересказу ТАСС (ecoportal.su/news/view/131192.html,
# 14.11.2025): 5 + 1 + (8 деревьев + 6 кустарников) + 11 травянистых.
# Сумма 31 при объявленных 32 -- расхождение самого источника (возможно,
# "золотарник" в первой группе -- это два вида, как записано ниже).
group_sizes_reported:
  1: 5
  2: 1
  3: {trees: 8, shrubs: 6}
  4: 11

source:
  act: ППМ № 369-ПП
  date: 2026-03-03
  title: >-
    О мерах по регулированию распространения и численности инвазивных растений
    на территории города Москвы
  species_total_declared: 32
  groups_total: 4

# Чем это отличается от всего остального в data/norms/: здесь запрет не
# геометрический, а видовой. Ни одна наша структура сейчас такого не умеет --
# ни каталог (plant_catalog.py), ни таблица отступов. Это новый тип правила.
rule_kind: species_blacklist

groups:
  1:
    ru: Наиболее опасные
    measure: удаление в течение 3 лет
    species:
      - Борщевик Сосновского
      - Люпин многолистный
      - Золотарник канадский
      - Золотарник гигантский
      - Рейнутрия
      - Айлант высочайший
  2:
    ru: Древесные, длительный срок удаления
    measure: удаление в течение 10 лет
    species:
      - Клён ясенелистный
  3:
    ru: Деревья и кустарники
    measure: запрет на высадку
    species:
      - Дуб красный
      - Роза морщинистая
      - Облепиха
    note: >-
      Названы 3 из 14 (8 деревьев + 6 кустарников по пересказу ТАСС).
      Неизвестны ещё 7 деревьев (дуб красный -- 1 из 8) и 4 кустарника
      (роза морщинистая, облепиха -- 2 из 6).
  4:
    ru: Травянистые виды
    measure: null
    species:
      - Прилипало пристающее
      - Недотрога мелкоцветковая
    note: Названы 2 из 11.

# Прямое следствие для ассортимента 515-ПП: пересечений быть не должно, но
# проверить стоит, когда перечень будет полным. "Роза ругоза" из таблицы 5
# 515-ПП -- это Rosa rugosa, то есть та же "роза морщинистая" из группы 3.
# Если подтвердится, это КОНФЛИКТ между двумя обязательными актами, и его
# придётся выносить наверх, а не разрешать самим.
conflicts_to_check:
  - species_369: Роза морщинистая
    species_515: Роза ругоза (таблица 5, палисадники)
    note: Похоже на один и тот же вид Rosa rugosa под разными названиями.
  - species_369: Роза морщинистая
    species_assortment_msk: Роза морщинистая (формы и сорта)
    source: assortment-msk/main_assortment.csv, строка 129 -- "Основной" ассортимент, "+" для дворов, магистралей, площадей, парков
    note: >-
      Совпадение названия дословное. Ассортимент заказчика рекомендует вид,
      который 369-ПП (группа 3) запрещает высаживать. При подборе видов
      GreenPlan 369-ПП как более новый и обязательный акт должен побеждать.
