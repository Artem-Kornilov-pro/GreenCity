# Перечень инвазивных видов растений, в отношении которых применяются меры по
# регулированию распространения и численности -- приложение 1 к ППМ 369-ПП.
# Перенесён целиком 2026-09-24 из текста приложения, переданного командой.
# 31 позиция = 32 вида: п. 1.3 "Золотарники канадский и гигантский" -- два
# вида одной строкой (разнесены ниже на две записи с тем же номером).
#
# Используется кодом: backend/core/invasive_species.py -> виды из перечня
# исключаются из каталога посадок (plant_catalog.load_catalog), то есть их не
# предложат ни GreenPlan, ни правка текстом, ни панель "Добавить объект".

status: полный

source:
  act: ППМ № 369-ПП
  date: 2026-03-03
  title: >-
    О мерах по регулированию распространения и численности инвазивных растений
    на территории города Москвы
  location_in_act: Приложение 1
  species_total_declared: 32

rule_kind: species_blacklist

# Меры по группам -- из пересказа ТАСС (ecoportal.su/news/view/131192.html),
# сам Порядок (приложение 2) не переносился. Для подбора посадок важно одно:
# ни один вид перечня не сажают -- группа III запрещена к высадке прямо,
# группы I и II подлежат удалению.
groups:
  I:
    ru: Наиболее опасные
    measure: удаление в течение 3 лет
    species:
      - {item: "1.1", ru: Айлант высочайший, la: Ailanthus altissima (Mill.) Swingle}
      - {item: "1.2", ru: Борщевик Сосновского, la: Heracleum sosnowskyi Manden}
      - {item: "1.3", ru: Золотарник канадский, la: Solidago canadensis}
      - {item: "1.3", ru: Золотарник гигантский, la: Solidago gigantea}
      - {item: "1.4", ru: Люпин многолистный, la: Lupinus polyphyllus Lindl.}
      - {item: "1.5", ru: Рейнутрия, la: Reynoutria ssp.}
  II:
    ru: Древесные, длительный срок удаления
    measure: удаление в течение 10 лет
    species:
      - {item: "2.1", ru: Клен ясенелистный, la: Acer negundo L.}
  III:
    ru: Деревья и кустарники
    measure: запрет на высадку
    species:
      - {item: "3.1", ru: Аморфа кустарниковая, la: Amorpha fruticosa L.}
      - {item: "3.2", ru: Девичий виноград, la: Parthenocissus inserta (A.Kern.) Fritsch}
      - {item: "3.3", ru: Дерен белый, la: Cornus albus L.}
      - {item: "3.4", ru: Дуб красный, la: Quercus rubra L.}
      - {item: "3.5", ru: Ирга колосистая, la: Amelanchier spicata Decne}
      - {item: "3.6", ru: Ирга ольхолистная, la: Amelanchier alnifolia (Nutt.) Nutt. ex M.Roem}
      # В тексте приложения латинское название без рода ("rhamnoides L") --
      # опечатка документа, род восстановлен: Hippophae.
      - {item: "3.7", ru: Облепиха крушиновидная, la: Hippophae rhamnoides L.}
      - {item: "3.8", ru: Орех маньчжурский, la: Juglans mandshurica Maxim.}
      - {item: "3.9", ru: Пузыреплодник калинолистный, la: Physocarpus opulifolius Maxim.}
      - {item: "3.10", ru: Робиния псевдоакация, aliases: [Белая акация], la: Robinia pseudoacacia L.}
      - {item: "3.11", ru: Роза морщинистая, aliases: [Шиповник морщинистый, Роза ругоза], la: Rosa rugosa Thunb}
      - {item: "3.12", ru: Рябинник рябинолистный, la: Sorbaria sorbifolia (L.) A.Braun}
      - {item: "3.13", ru: Черемуха виргинская, la: Prunus virginiana L.}
      - {item: "3.14", ru: Ясень пенсильванский, la: Fraxinus pennsylvanica Marshall}
  IV:
    ru: Травянистые виды
    measure: сокращение численности до безопасных значений
    species:
      - {item: "4.1", ru: Белокопытник гибридный, la: Petasites hybridus (L.) G.Gaertn., B.Mey. & Scherb.}
      - {item: "4.2", ru: Вероника нитевидная, la: Veronica filiformis Sm.}
      - {item: "4.3", ru: Мелколепестник канадский, la: Erigeron canadensis L.}
      - {item: "4.4", ru: Недотрога железконосная, la: Impatiens glandulifera Royle}
      - {item: "4.5", ru: Недотрога мелкоцветковая, la: Impatiens parviflora DC.}
      - {item: "4.6", ru: Подсолнечник клубневой, aliases: [Топинамбур], la: Helianthus tuberosus L.}
      - {item: "4.7", ru: Прилипало пристающее, la: Adenocaulon adhaerescens Maxim.}
      - {item: "4.8", ru: Цицания широколистная, la: Zizania latifolia (Griseb.) Hance ex F.Muell.}
      - {item: "4.9", ru: Череда олиственная, la: Bidens frondosa L}
      - {item: "4.10", ru: Элодея канадская, la: Elodea canadensis Michx}
      - {item: "4.11", ru: Эхиноцистис лопастной, la: Echinocystis lobata (Michx.) Torr. & A.Gray}

# Конфликты с другими документами -- выносить заказчику, а не разрешать
# самим. 369-ПП новее и обязателен, поэтому в коде он побеждает.
conflicts:
  assortment_msk_main:
    source: assortment-msk/main_assortment.csv (ассортимент заказчика)
    note: >-
      Основной/дополнительный ассортимент рекомендует восемь видов, которые
      369-ПП запрещает высаживать (группа III).
    species:
      - Дуб красный
      - Орех маньчжурский
      - Черемуха виргинская (формы и сорта)
      - Аморфа кустарниковая
      - Ирга колосистая
      - Пузыреплодник калинолистный (формы и сорта)
      - Роза морщинистая (формы и сорта)
      - Рябинник рябинолистный (формы и сорта)
  assortment_515:
    source: 515-pp/assortment_front_garden.csv, таблица 5 (палисадники)
    species: [Роза ругоза]
    note: >-
      Rosa rugosa -- та же роза морщинистая (п. 3.11), под другим русским
      названием. Конфликт двух обязательных актов.
  needs_check:
    - species: Девичий виноград пятилисточковый
      source: assortment-msk/main_assortment.csv
      note: >-
        369-ПП запрещает девичий виноград Parthenocissus inserta; пятилисточковый
        -- обычно P. quinquefolia, другой вид. Но в питомниках P. inserta часто
        продают под этим же названием. В коде считается запрещённым (правило
        "название начинается с запрещённого" -- осторожная сторона), проверить
        с дендрологом.
