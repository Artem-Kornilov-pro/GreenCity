# СП 59.13330.2020 "Доступность зданий и сооружений для маломобильных групп
# населения" (с Изменениями № 1-4). Извлечено 2026-09-23 из копии текста с
# изменениями (tiflocentre.ru). Разбирался раздел 5.1 (пути движения на
# участке) -- только пункты, где упоминается озеленение или габарит над и
# вдоль пешеходного пути.
#
# Прямых норм размещения деревьев и кустарников здесь нет. Влияют габариты:
# крона над дорожкой не должна опускаться ниже 2,1 м, посадки не должны
# сужать путь.

source:
  act: СП 59.13330.2020
  title: Доступность зданий и сооружений для маломобильных групп населения

rules:
  - clause: "5.1.7"
    text: >-
      Ширину прохожей части пешеходного пути для МГН следует принимать не менее
      2 м. Высота свободного пространства над прохожей частью должна
      составлять не менее 2,1 м. В стесненных условиях допускается принимать
      ширину прохожей части пешеходного пути не менее 1,2 м, при этом не реже
      чем через каждые 25 м ... необходимо предусматривать ... "карманы" длиной
      ... не менее 2,5 м при общей с прохожей частью ширине не менее 2,0 м.
    in_code: >-
      Ширина пути -- не наша зона ответственности (дорожки приходят из DXF).
      Высота 2,1 м над путём -- нет: ни высота штамба, ни свес кроны над
      дорожкой не проверяются. Ствол держится на 0,7 м (дерево) / 0,5 м (куст)
      от края дорожки по СП 42, крона радиусом больше этого может нависать.
  - clause: "5.1.9"
    text: >-
      Высоту бортовых камней (бордюров) по краям пешеходных путей на участке
      вдоль газонов и озелененных площадок следует принимать не менее 0,05 м.
    in_code: Нет -- бордюры рисуются из DXF как есть.
  - clause: "5.1.10"
    text: >-
      Взамен тактильных контрастных указателей для обозначения стволов
      деревьев, расположенных на прохожей части пешеходного пути, допускается
      применять приствольные решетки с учетом требований к ячейкам по 5.1.18.
    in_code: >-
      Не требуется: генераторы не ставят деревья на прохожую часть (0,7 м от
      края дорожки по СП 42).
  - clause: "5.1.13"
    text: >-
      Там, где высота свободного пространства от поверхности земли до
      выступающих снизу конструкций лестниц менее 2,1 м, следует
      предусматривать ограждение или озеленение (кустарник).
    in_code: Нет -- лестниц в сцене нет.
