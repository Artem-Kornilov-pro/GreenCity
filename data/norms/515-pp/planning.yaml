# Числовые планировочные требования из текста 515-ПП (не из таблиц приложения --
# таблицы вынесены в assortment_*.csv и furniture.csv рядом).
#
# У каждого значения указан пункт приложения к постановлению: без этого через
# месяц не отличить норму от нашей собственной настройки (в коде такая путаница
# уже есть, см. backend/placement.py -- там рядом лежат "СНиП, табл. 4" и
# "не норма, а здравый смысл").

source:
  act: ППМ № 515-ПП
  date: 2017-08-08
  title: >-
    Базовые требования к благоустройству территории жилой застройки при
    реализации Программы реновации жилищного фонда в городе Москве
  scope: >-
    Применяется при проектировании жилой застройки в рамках Программы реновации
    (п. 1.2), включая участки сохраняемой застройки в её границах (п. 1.3).
    ВАЖНО: это не общегородская норма -- за пределами реновации акт напрямую не
    обязателен, и переносить его цифры на любой двор нельзя без оговорки.

# Шаг посадок в линейных паттернах -- прямой вход для этапа расстановки.
planting_patterns:
  boulevard_main_alley:
    ru: Аллейные посадки вдоль главной аллеи бульвара
    clause: "4.2"
    species: высокоствольные крупномерные деревья
    step_m: [5.0, 6.0]
  boulevard_side_alley:
    ru: Рядовые посадки и живые изгороди вдоль боковых аллей бульвара
    clause: "4.2"
    step_m: [5.0, 6.0]
    note: Шаг 5,0-6,0 м в пункте указан для посадок бульвара в целом.
  pedestrian_route_row:
    ru: Рядовые посадки на маршрутах интенсивного пешеходного движения
    clause: "5.1"
    step_m: [6.0, 8.0]

# Когда высадка в грунт невозможна (п. 5.1) -- контейнерное озеленение.
container_planting:
  clause: "5.1"
  min_size_m:
    tree: [1.2, 1.2, 0.8]
    bush: [0.8, 0.8, 0.5]

# Габариты элементов планировки, влияющие на то, куда вообще можно сажать.
layout:
  boulevard:
    clause: "4.1"
    min_width_m: 10.0
    side_alleys_from_width_m: 15.0
  bike_path:
    clause: "4.1"
    width_m: [1.5, 3.0]
  dog_area:
    clause: "4.7"
    min_area_sqm: 400
    note: Имеет сетчатое ограждение, освещение и периметральное озеленение.
  courtyard_garden_on_garage_roof:
    clause: "1.6"
    soil_layer_m: [1.5, 2.0]
    note: Насыпка облегчённого растительного основания.

# Опоры освещения -- существующие объекты, от которых посадка должна отступать
# (норма отступа не здесь, а в СП 42.13330; тут только их высота и шаг).
lighting:
  fire_lane_pole:
    clause: "6.2, таблица 2 п. 8"
    height_m: [9.0, 11.0]
    spacing_m: [25.0, 30.0]
  garden_torchere:
    clause: "6.2, таблица 2 п. 7"
    height_m: [5.0, 7.0]
    spacing_m: [20.0, 20.0]
    note: Декоративные опоры в саду двора и на озеленённых объектах рекреации.

# Учёт существующего озеленения при расчёте показателей.
accounting:
  existing_green_radius_m:
    clause: "2.2"
    value: 400
    note: >-
      В расчётные показатели включаются существующие озеленённые территории
      общего пользования в радиусе 400 м от размещаемой жилой застройки.

# Требования без числовых значений -- зафиксированы, чтобы не искать их заново
# в тексте и не принять их отсутствие за "нормы нет".
qualitative:
  - clause: "1.6.2, 4.3"
    text: >-
      Размещение детских и спортивных площадок -- с учётом инсоляционного режима
      и нормативных требований к расстоянию от окон жилых зданий, наземных
      парковок, технических сооружений. Конкретные расстояния в 515-ПП не
      приведены, берутся из иных актов.
  - clause: "1.6.3"
    text: >-
      При инвентаризации существующих зелёных насаждений определяются деревья и
      кустарники ценных пород, подлежащие сохранению. Критерия ценности акт не
      задаёт -- он в ППМ 743-ПП.
  - clause: "1.2"
    text: >-
      Палисадник -- озеленённые участки с газоном, кустарниками и цветниками из
      многолетников, примыкающие к отмостке дома и ограниченные тротуаром и
      площадками перед входными группами. Для них отдельный ассортимент
      (assortment_front_garden.csv), более узкий, чем базовый.
