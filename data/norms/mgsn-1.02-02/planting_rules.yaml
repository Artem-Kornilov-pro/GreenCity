# Требования МГСН 1.02-02 к размещению посадок (кроме плотности -- она в
# greening_density.yaml рядом). Это ППМ 623-ПП из ТЗ кейса -- см. source там же.
# Извлечено 2026-09-23 из полного текста с изменениями (зеркало meganorm.ru).

source:
  act: ТСН 30-307-2002 г. Москвы (МГСН 1.02-02)
  approved_by: Постановление Правительства Москвы от 06.08.2002 № 623-ПП

rules:
  - clause: "4.2.4"
    text: >-
      При проектировании озеленения следует обеспечивать: минимальные
      расстояния посадок деревьев и кустарников до инженерных сетей, зданий и
      сооружений (табл. 7.6 МГСН 1.01) ... Рекомендуется соблюдать
      максимальное количество насаждений на различных территориях города
      (таблица В.1)
    in_code: >-
      Расстояния -- та же таблица, что 743-ПП табл. 3.6.1 и СП 42 табл. 9.1
      (backend/core/setback_norms.py::SETBACK_NORMS). Максимум плотности -- в коде
      не проверяется, только greening_density.yaml.

  - clause: "4.2.8"
    text: >-
      При посадке деревьев в зонах действия теплотрасс следует учитывать фактор
      прогревания почвы в обе стороны от оси теплотрассы на расстояние:
      интенсивного прогревания -- до 2 м, среднего -- 2-6 м, слабого -- 6-10 м.
      У теплотрасс не следует размещать: липу, клен, сирень, жимолость -- ближе
      2 м, тополь, боярышник, кизильник, дерен, лиственницу, березу -- ближе
      3-4 м.
    in_code: >-
      backend/core/setback_norms.py::SPECIES_SETBACK_RULES (HEAT_SENSITIVE_*). Для
      второй группы берётся верхняя граница 4 м. Норма -- от оси теплотрассы,
      у нас -- от края её охранного коридора (ось + 2 м, parser/parse_dxf.py),
      то есть строже нормы на 2 м.

  - clause: "4.2.9.2"
    text: >-
      Шумозащитные насаждения следует проектировать в виде однорядных или
      многорядных рядовых посадок не ниже 7 м, обеспечивая в ряду расстояния
      между стволами взрослых деревьев 8-10 м (с широкой кроной), 5-6 м (со
      средней кроной), 3-4 м (с узкой кроной), подкроновое пространство
      следует заполнять рядами кустарника.
    in_code: >-
      Нет. Отдельного шумозащитного паттерна в GreenPlan нет; числа --
      ориентир для linear_hedge_row вдоль дорог (pattern_library.py).

  - clause: "4.2.9.3"
    text: >-
      В условиях высокого уровня загрязнения воздуха следует формировать
      многорядные древесно-кустарниковые посадки: при хорошем режиме
      проветривания -- закрытого типа (смыкание крон), при плохом режиме
      проветривания -- открытого, фильтрующего типа (не смыкание крон).
    in_code: Нет -- данных о загрязнении и проветривании в DXF нет.

  - clause: "4.7.5, таблица 4.7"
    text: >-
      При размещении игрового оборудования на детских игровых площадках
      необходимо соблюдать минимальные расстояния безопасности ... В пределах
      указанных расстояний на участках территории площадки не допускается
      размещения ... веток, стволов, корней деревьев.
    safety_distances_m:
      Качели: "не менее 1,5 м в стороны от боковых конструкций и не менее 2,0 м вперёд (назад) от крайних точек качели в состоянии наклона"
      Качалки: "не менее 1,0 м в стороны от боковых конструкций и не менее 1,5 м вперёд от крайних точек качалки в состоянии наклона"
      Карусели: "не менее 2 м в стороны от боковых конструкций и не менее 3 м вверх от нижней вращающейся поверхности карусели"
      Горки: "не менее 1 м от боковых сторон и 2 м вперёд от нижнего края ската горки"
    in_code: >-
      Косвенно: зона детской площадки (playground_zone) целиком -- warning,
      генераторы в неё не сажают вовсе (greenery_generator._keep_out_shapes,
      placement.Placer.region). Отдельного игрового оборудования внутри зоны
      в DXF нет.
