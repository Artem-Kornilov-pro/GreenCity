# Норма посадки на 1 га озеленённой территории.
#
# Это ответ на вопрос "СКОЛЬКО сажать", которого не было ни в одном другом
# собранном акте: СП 42.13330 п. 9.8 даёт только м² на человека в масштабе
# города, к отдельному двору неприменимо.

source:
  act: ТСН 30-307-2002 г. Москвы (МГСН 1.02-02)
  title: >-
    Нормы и правила проектирования комплексного благоустройства на территории
    города Москвы
  approved_by: Постановление Правительства Москвы от 06.08.2002 № 623-ПП
  location_in_act: Приложение В, таблица В.1
  status_note: >-
    Приложение В помечено как РЕКОМЕНДУЕМОЕ. В отличие от таблицы 9.1
    СП 42.13330 (обязательные отступы), это ориентир, а не запрет. Отклонение от
    него не делает проект несоответствующим -- но обосновывать плотность чем-то
    надо, и другого ориентира у нас нет.

# ВНИМАНИЕ: достоверность строк разная, см. confidence у каждой.
# Официальный текст приложения В достать не удалось: страницы-оглавления,
# а автоматический разбор страницы ГАРАНТа дважды подряд выдал ОДНИ И ТЕ ЖЕ
# ЧИСЛА, но РАЗНЫЕ и заведомо бессмысленные подписи строк (во второй раз --
# "Балконы", "Высота (см)"). То есть числовой ряд устойчив, а сопоставление
# чисел с типами территорий подтверждено только для первых четырёх строк.
rows:
  - object: Парки общегородские и районные
    trees_per_ha: [120, 170]
    shrubs_per_ha: [800, 1000]
    confidence: подтверждено двумя независимыми чтениями страницы

  - object: Скверы
    trees_per_ha: [100, 130]
    shrubs_per_ha: [1000, 1300]
    confidence: подтверждено двумя независимыми чтениями страницы

  - object: Бульвары
    trees_per_ha: [200, 300]
    shrubs_per_ha: [1200, 1300]
    confidence: подтверждено двумя независимыми чтениями страницы

  - object: Участки жилой застройки
    trees_per_ha: [100, 120]
    shrubs_per_ha: [400, 480]
    confidence: >-
      деревья подтверждены; кустарники выведены по позиции в числовом ряду,
      прямого подтверждения подписи нет -- ПРОВЕРИТЬ

# Ещё шесть строк в таблице есть, числовые пары устойчиво повторяются при
# разных чтениях, но какому типу территории они соответствуют -- неизвестно.
# Записаны без подписей намеренно: пара чисел без названия объекта бесполезна,
# а придуманное название хуже, чем его отсутствие.
unlabeled_rows:
  - trees_per_ha: [160, 200]
    shrubs_per_ha: [640, 800]
  - trees_per_ha: [140, 180]
    shrubs_per_ha: [560, 720]
  - trees_per_ha: [100, 130]
    shrubs_per_ha: [400, 520]
  - trees_per_ha: [180, 250]
    shrubs_per_ha: [720, 1000]
  - trees_per_ha: [150, 180]
    shrubs_per_ha: [600, 720]
  - trees_per_ha: [150, 180]
    shrubs_per_ha: [600, 720]

# Замер на locations/19_2ya_pryadilnaya (2.04 га пригодной площади), настройки
# генератора по умолчанию. Считалось от площади allowed-зон, а не от всего
# участка -- то есть это плотность именно по озеленяемой территории, как в норме.
measured_2026_09_18:
  location: 19_2ya_pryadilnaya
  plantable_area_ha: 2.04
  trees:
    generated_per_ha: 148
    norm_residential: [100, 120]
    verdict: превышение нормы примерно на четверть
  bushes:
    generated_per_ha: 88
    norm_residential: [400, 480]
    verdict: НЕДОБОР примерно в пять раз
  note: >-
    Расхождение разнонаправленное, и это важнее самих цифр: генератор сажает
    слишком много деревьев и слишком мало кустарников. Шаг сетки по умолчанию
    (DEFAULT_GRID_SPACING_M = 4.0 в greenery_generator.py) даёт до 625 точек на
    га, но нормативным 110 деревьям на га соответствует шаг около 9.5 м --
    прямо шаг подкручивать нельзя, потому что фактическая плотность сильно
    зависит от того, сколько точек отсеют ограничения (здесь из 625
    потенциальных осталось 148).
