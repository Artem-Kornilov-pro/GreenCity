# МАКСИМАЛЬНОЕ количество деревьев и кустарников на 1 га озеленённой
# территории -- ответ на вопрос "не слишком ли густо", которого нет ни в одном
# другом собранном акте (СП 42.13330 п. 9.8 даёт только м² на человека в
# масштабе города, к отдельному двору неприменимо).
#
# ВАЖНО: это ВЕРХНЯЯ граница, а не целевая норма. Таблица называется
# "Максимальное количество", а п. 4.2.4 говорит "рекомендуется соблюдать
# максимальное количество насаждений". Прежняя версия этого файла читала её
# как норму ("недобор кустарника в пять раз") -- это было неверно: сажать
# меньше максимума не нарушение.

source:
  act: ТСН 30-307-2002 г. Москвы (МГСН 1.02-02)
  title: >-
    Нормы и правила проектирования комплексного благоустройства на территории
    города Москвы
  # Это тот самый "МГСН ... постановление Правительства Москвы № 623-ПП" из
  # ТЗ кейса: отдельного документа "623-ПП" нет, это постановление, которым
  # утверждены МГСН 1.02-02.
  approved_by: Постановление Правительства Москвы от 06.08.2002 № 623-ПП
  location_in_act: Приложение В (рекомендуемое), таблица В.1; ссылка на неё -- п. 4.2.4
  extracted: >-
    2026-09-23, полный текст с изменениями (зеркало meganorm.ru). Все десять
    строк сопоставлены с подписями по самому тексту таблицы -- прежние
    "неподписанные строки" и строка с пометкой ПРОВЕРИТЬ закрыты.
  status_note: >-
    Приложение В -- РЕКОМЕНДУЕМОЕ. Ориентир, а не запрет: превышение не делает
    проект несоответствующим, но обосновывать его придётся.

rows:
  # Озеленённые территории общего пользования
  - object: Парки общегородские и районные
    trees_per_ha: [120, 170]
    shrubs_per_ha: [800, 1000]
  - object: Скверы
    trees_per_ha: [100, 130]
    shrubs_per_ha: [1000, 1300]
  - object: Бульвары
    trees_per_ha: [200, 300]
    shrubs_per_ha: [1200, 1300]
  # Озеленённые территории на участках застройки
  - object: Участки жилой застройки
    trees_per_ha: [100, 120]
    shrubs_per_ha: [400, 480]
  - object: Участки детских садов и яслей
    trees_per_ha: [160, 200]
    shrubs_per_ha: [640, 800]
  - object: Участки школ
    trees_per_ha: [140, 180]
    shrubs_per_ha: [560, 720]
  - object: Спортивные комплексы
    trees_per_ha: [100, 130]
    shrubs_per_ha: [400, 520]
  - object: Больницы и лечебные учреждения
    trees_per_ha: [180, 250]
    shrubs_per_ha: [720, 1000]
  - object: Участки промышленных предприятий
    trees_per_ha: [150, 180]
    shrubs_per_ha: [600, 720]
    note: В зависимости от профиля предприятия (сноска * к таблице)
  # Озеленённые территории специального назначения
  - object: Улицы, набережные
    trees_per_ha: [150, 180]
    shrubs_per_ha: [600, 720]
    note: >-
      Сноска ** к таблице: "На 1 км при условии допустимости насаждений" --
      для улиц единица измерения -- штук на 1 км, а не на 1 га.
  - object: Санитарно-защитные зоны
    trees_per_ha: null
    shrubs_per_ha: null
    note: В зависимости от процента озеленения зоны (п. 2.28 СанПиН 2.2.1/2.1.1.1031)

# Таблица В.2 -- доля цветников от площади озеленения объектов рекреации, %.
# Не менее половины площади цветника -- из многолетников.
flowerbed_share_percent:
  Парки: [2.0, 2.5]
  Сады: [2.5, 3.0]
  Скверы: [4.0, 5.0]
  Бульвары: [3.0, 4.0]

# Таблица В.3 -- обеспеченность озеленёнными территориями участков, % от
# площади участка. Прямой критерий для отчёта: "какая доля участка озеленена".
greened_share_percent:
  Участки детских садов-яслей: {min: 50}
  Участки школ: {min: 40}
  Участки больниц: [50, 65]
  Участки культурно-просветительных учреждений: [20, 30]
  Участки территории ВУЗов: [30, 40]
  Участки техникумов: {min: 40}
  Участки профтехучилищ: {min: 40}
  Участки жилой застройки: [40, 60]
  Участки производственной застройки: [10, 15]

# Замер на locations/19_2ya_pryadilnaya (2.04 га пригодной площади),
# генератор по сетке с настройками по умолчанию. Плотность считалась от
# площади allowed-зон -- то есть именно по озеленяемой территории, как в
# таблице.
measured_2026_09_18:
  location: 19_2ya_pryadilnaya
  plantable_area_ha: 2.04
  trees:
    generated_per_ha: 148
    max_residential: [100, 120]
    verdict: ПРЕВЫШЕНИЕ рекомендуемого максимума примерно на четверть
  bushes:
    generated_per_ha: 88
    max_residential: [400, 480]
    verdict: в пределах максимума (это не "недобор" -- таблица задаёт верхнюю границу)
  note: >-
    Замер сделан до правила 10 м от здания для липы и клёна (743-ПП,
    прим. 3 к табл. 3.6.1), которое сокращает число мест для деревьев у
    домов; повторить после него. Шаг сетки по умолчанию
    (DEFAULT_GRID_SPACING_M = 4.0 в greenery_generator.py) даёт до 625 точек
    на га, из которых ограничения оставили 148.
