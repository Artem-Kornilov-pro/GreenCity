# СП 82.13330.2016 "Благоустройство территорий" (актуализированная редакция
# СНиП III-10-75, с Изменениями № 1, 2). Извлечено 2026-09-23 из копии текста
# с изменениями (tiflocentre.ru). Разбирались разделы 7 (ограды) и 9
# (озеленение застраиваемых территорий).
#
# Это в основном свод правил ПРОИЗВОДСТВА работ (ямы, сроки, полив, приёмка),
# а не размещения. Для размещения значим один пункт -- 9.22, он в коде. Для
# "сценария выгрузки документации для внедрения" из ТЗ полезны остальные:
# размеры посадочных мест и требования приёмки -- это техусловия, которые
# идут в ведомость посадок.

source:
  act: СП 82.13330.2016
  title: Благоустройство территорий
  amendments: "Изм. № 1 (приказ Минстроя от 20.09.2019 № 560/пр), Изм. № 2 (приказ Минстроя от 23.12.2019 № 840/пр)"

# --- Размещение: реализовано в коде ------------------------------------------

placement_rules:
  - clause: "9.22"
    text: >-
      Размещение колючих растений (например, кустарников розы, барбариса,
      боярышника) для ландшафтных композиций допускается на расстоянии не
      менее 2 м от площадок и пешеходных коммуникаций.
    in_code: >-
      backend/setback_norms.py::SPECIES_SETBACK_RULES (THORNY_GENERA) -- 2 м
      от pedestrian_path и playground_zone, для дерева и куста. Шиповник
      добавлен как та же роза.

# --- Выбор видов: НЕ реализовано (нужен подбор видов по зоне, issue #59) ----

species_rules:
  - clause: "9.22"
    text: >-
      Посадка в населенных местах женских экземпляров тополей и шелковиц,
      засоряющих территорию и воздух во время плодоношения, не допускается.
    in_code: Нет -- пол экземпляра в каталоге не указан.
  - clause: "9.22"
    text: >-
      При выборе посадочного материала при формировании элементов озеленения
      вдоль пешеходных улиц, тротуаров, площадей, а также на площадках
      различного функционального назначения следует исключать посадку
      токсичных пород деревьев и кустарников.
    in_code: >-
      Нет -- в каталоге нет признака токсичности. Перечня токсичных пород в
      самом своде правил тоже нет.
  - clause: "9.22"
    text: >-
      Для озеленения детских игровых площадок не допускается использовать
      колючие и обильно плодоносящие деревья и кустарники.
    in_code: >-
      Частично: внутрь детской площадки генераторы не сажают вовсе, а колючим
      -- 2 м от её края (правило выше). "Обильно плодоносящие" -- признака в
      каталоге нет.

# --- Производство работ: для ведомости посадок -------------------------------

planting_pits:
  - clause: "9.6"
    text: >-
      Ямы для посадки стандартных саженцев и саженцев с комом должны быть
      глубиной 75 - 90 см, для саженцев со стержневой корневой системой -
      80 - 100 см. Стандартные саженцы следует высаживать в ямы диаметром
      60 - 80 см. Размер ям для посадки саженцев с комом должен быть на 0,5 м
      больше наибольшего размера кома.
  - clause: "9.7"
    text: >-
      Кустарники следует высаживать в ямы и траншеи глубиной 50 см. Для
      одиночных кустов диаметр ям должен быть 50 см. Ширина траншей под
      групповые посадки кустарников должна быть 50 см для однорядной посадки с
      добавлением 20 см на каждый следующий ряд посадки.
  - clause: "7.3"
    text: >-
      Ограды в виде живой изгороди должны устраиваться посадкой одного ряда
      кустарника в заранее подготовленные траншеи шириной и глубиной не менее
      50 см. На каждый последующий ряд посадок кустарника ширина траншей должна
      быть увеличена на 20 см. ... живой изгороди в виде кустарника с
      максимальной высотой 1,2 м (на участках рекреационного назначения).
  - clause: "9.9"
    text: >-
      У деревьев и саженцев со стволом диаметром до 5 см на высоте 1,3 м от
      корневой шейки должен быть ком диаметром или размером стороны не менее
      70 см. При увеличении диаметра ствола на каждый 1 см размер диаметра или
      стороны кома должен быть увеличен на 10 см.

planting_material:
  - clause: "9.1"
    text: >-
      Саженцы деревьев и кустарников должны соответствовать ГОСТ 24835,
      деревья декоративных лиственных пород ГОСТ 24909, деревья хвойных пород
      ГОСТ 25769, декоративные кустарники ГОСТ 26869, деревья и кустарники
      садовые и архитектурные формы ГОСТ 28055.

watering_litres:
  clause: "9.27"
  standard_sapling: 20
  tree_root_ball_up_to_1x1_m: 50
  tree_root_ball_1x1_m_and_more: 100
  bush: 10
  perennial_in_flowerbed: 5
  flower_seedlings_or_lawn_per_m2: 10

lawn_seeding_g_per_m2:
  clause: "9.24"
  note: Нормы высева -- "не менее"
  Мятлик луговой и клевер красный: 5
  Овсяница красная: 15
  Рейграс пастбищный, овсяница луговая, костёр безостый: 10
  Тимофеевка луговая и клевер белый: 3
  Полевица белая: 1.5

acceptance:
  clause: "9.28"
  items:
    - Толщина слоя растительного грунта -- не менее 10 см (шурф 30x30 см на каждые 1000 м2)
    - Посадочный материал -- по проекту или группам взаимозаменяемости (приложение В)
    - Паспорта и карантинные свидетельства на посадочный материал
    - Неприжившихся растений -- не более 20%, иначе замена
