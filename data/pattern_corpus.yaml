# Retrieval-корпус для GreenPlan, Этап 3 (issue #23).
#
# По каждому из 9 реальных, документированных проектов в locations/ -- какой
# паттерн из backend/greenplan/pattern_library.py применён в каком виде геометрической
# зоны (zone_partitioning.ZoneKind), и цитата/пересказ из соответствующего
# locations/<slug>/design_rationale.md, откуда это взято. Это НЕ полный
# корпус из 20 проектов, упомянутый в issue #23 -- тот восстанавливает другой
# разработчик отдельно и в репозитории пока не появился (см.
# backend/greenplan/pattern_corpus.py). Здесь честно 14 проектов, у которых уже есть и
# реальный DXF, и разобранная документация (9 из первой серии + 5 из
# ветки new-convert).
#
# Проект без художественной концепции (11_frunzenskaya_naberezhnaya) размечен
# паттерном generic_fill, а не пропущен -- иначе retrieval для будущего
# похожего "чисто технического" участка вообще не нашёл бы соседа и
# выдумывал бы отсутствующее сходство с художественными проектами.

02_peschany_pereulok:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      "Размещение кустарников между проезжей частью и пешеходными зонами
      создаёт дополнительный защитный барьер" -- буферная полоса 4 м вдоль
      дороги (снежноягодник Доренбоза, спирея серая Grefsheim, кизильник
      блестящий -- роза морщинистая исключена как инвазивный вид 369-ПП),
      кусты с шагом 1.4 м, деревья (липа мелколистная) с шагом 12 м.
  building_border:
    pattern: building_ring
    source_quote: >
      Кольцо кустов (снежноягодник) вокруг каждого здания в пределах
      50-метровой полосы у дороги/дорожек -- 18 из 30 зданий, 1241 куст;
      остальные 12 физически не связаны с улицей дорогой/дорожкой.

06_kamchatskaya_ulitsa:
  open_area:
    pattern: diagonal_rows
    source_quote: >
      "В основу проекта положена система четких диагональных линий
      озеленения, ориентированных под углом к проезжей части и пешеходным
      дорожкам" -- диагонали внутри очищенных зон газона, группы кустов и
      многолетников вдоль каждой линии (спирея серая, дёрен белый, дёрен
      отпрысковый, мискантус китайский).

07_nizhnie_polya:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      "Использование полос и ритма в оформлении улицы" (буферная
      функциональная зона профиля) -- полоса вдоль дороги (ива ломкая
      Буллата, спирея серая, пузыреплодник калинолистный, лапчатка
      кустарниковая, деревья -- клён остролистный/Гиннала), после починки
      сетей (electrical keepout был больше площади участка) -- 2090
      кустов, 127 деревьев.

10_stary_gay:
  open_area:
    pattern: flowing_rows
    source_quote: >
      "Формы живых изгородей словно напоминают краски, стекающие со
      склонов к тротуарам и проезжей части" -- волнистые линии
      (синус-модуляция, амплитуда 4 м, длина волны 40 м), двурядная
      изгородь на 3 из 4 линий (барбарис Тунберга, туя западная,
      можжевельник, калина обыкновенная).

11_frunzenskaya_naberezhnaya:
  open_area:
    pattern: generic_fill
    source_quote: >
      В записке нет художественной концепции вообще -- чисто техническое
      благоустройство (посадка взамен вырубаемых по санитарному
      состоянию, компенсационные мероприятия), без таблицы видов и без
      признаков, отличающих один вид доозеленения от другого.
  path_corridor:
    pattern: generic_fill
    source_quote: >
      Та же причина, что и для open_area этого проекта: нет данных для
      геометрического паттерна, использован обычный равномерный генератор.

12_natashinsky_proezd:
  open_area:
    pattern: grove_clusters
    source_quote: >
      "Групповые посадки кустарников, формирующие орнаментальные
      композиции, вдохновлённые русскими народными узорами" (образ
      русского пейзажа) -- 25 роще по 3-7 деревьев (липа, тополь, клён,
      яблоня, сосна) + 30 пятен декоративных злаков по 10-20 растений.

13_kharkovsky_proezd:
  open_area:
    pattern: grove_clusters
    source_quote: >
      "Образ русского пейзажа... рощи, хвойные массивы, поля со злаками,
      извилистые берега" -- 6 роще по 2-4 дерева (сосна/ель/берёза), 10
      рыхлых пятен злаков по 6-14 растений (вейник, мискантус, молиния).

19_2ya_pryadilnaya:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      Живые изгороди по реальной ведомости посадочного материала (таблицы
      7-8): барбарис Тунберга 12 шт/пог.м, кизильник блестящий 12
      шт/пог.м, пузыреплодник Лютеус 5 шт/пог.м -- вдоль полосы у дороги
      (3.5 м), реальная погонная плотность сохранена.
  open_area:
    pattern: grove_clusters
    source_quote: >
      Таблица 7 ведомости отмечает "группы" в примечании для каждого вида
      дерева -- несколько случайных центров, вокруг каждого группа из 2-4
      деревьев ОДНОГО вида (липа крупнолистная доминирует, 161 из 263).

04_kharkovskaya_ulitsa:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      "Основой композиции являются протяженные массивы посадок кустарников
      одного вида с формируемой кроной" (бионический стиль, из
      `data/ПЗ Харьковская улица.docx`) -- 9 видов кустарника, у каждого
      свой контур группы вдоль улицы, плюс акцентная группа декоративных
      яблонь (47 шт.) для сезонной декоративности.

05_bagritskogo_ulitsa:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      "Создания зеленых буферных зон (плотных многорядных посадок) вдоль
      проезжих частей" и "устройство двурядной стриженной живой изгороди"
      (`data/Раздел 1.1_ПЗ (пояснительная записка).pdf`) -- 15 видов новых
      кустарников точками вдоль улицы 1.6 км, крупнейшие группы: спирея
      японская 'Darts Red' (699), спирея Вангутта (397).

08_lodochnaya:
  path_corridor:
    pattern: generic_fill
    source_quote: >
      Источник (`07_Л_ПВ`) -- перечётная ведомость существующих деревьев,
      не записка с концепцией: 628 "Сохранить" из 1090 обследованных.
      Новая посадка по проекту минимальна (7 лип, 31 куст сирени) --
      стратегия участка это сохранение существующего каркаса, а не
      художественный приём для новой посадки, размечать нечего.

09_izmaylovskaya_ploshad:
  open_area:
    pattern: grove_clusters
    source_quote: >
      Реальный дендроплан (не текст записки -- та описывает лишь узкий
      раздел на 9 деревьев компенсационной посадки, см.
      design_rationale.md): 1930 новых кустов по 11 видам крупными
      однородными группами (можжевельник казацкий 378, лапчатка 297,
      спирея серая 259) на открытой площади -- классифицировано по составу
      (крупные однопородные группы, не строчная посадка), текстового
      описания приёма расстановки в источниках нет.

17_gruzinskaya_m:
  path_corridor:
    pattern: generic_fill
    source_quote: >
      Источник (`10001169-ООС2`) -- раздел "Охрана окружающей среды"
      (география/климат/геология участка), не записка по озеленению;
      единственная проектная посадка по нему -- 9 клёнов Гиннала
      компенсационно. Богатый дендроплан сцены (3614 деревьев, 619 кустов,
      см. design_rationale.md) взят из отдельных посадочных DWG без
      текстового описания приёма расстановки -- размечать конкретным
      геометрическим паттерном нечестно, использован generic_fill.

20_makeeva_s:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      "Посадки подчёркивают линейную перспективу улицы и усиливают
      ощущение глубины пространства" -- буферная полоса 15 м вдоль дороги
      (можжевельник скальный, клён сахаристый, берёза полезная, черёмуха
      Шуберт).
  building_border:
    pattern: building_ring
    source_quote: >
      Кольцо можжевельника скального вокруг каждого из 88 зданий (2939
      кустов) -- буферная полоса вдоль дороги в принципе не покрывала
      дворы вдали от проезжей части.
  open_area:
    pattern: poisson_scatter_fill
    source_quote: >
      "Создание ярусности посадок в уже существующих ландшафтах" --
      редкий разброс по всей пригодной площади участка, не только у
      дороги, Пуассон-подобная выборка с шагом 6/12 м (1183 куста + 269
      деревьев).

# --- Синтетические эталонные участки ------------------------------------------
# Образцы приёмов озеленения, собранные генератором tools/primers/build_primers.py
# (см. докстринг backend/greenplan/pattern_corpus.py про суффикс "_primer").
# Реального заказчика у них нет; source_quote пересказывает design_rationale.md
# самого участка -- замысел, из которого GreenPlan берёт приём "по аналогии".
# Каждый эталон -- законченный проект: дорожки, сети, МАФ, посадки конкретных
# видов, ни одного нарушения нормативных отступов.

21_road_buffer_primer:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      Шумозащитная полоса вдоль дороги: от кромки проезжей части -- 2 м
      газона, затем двухрядная стриженая изгородь из кизильника блестящего
      (нижний ярус задерживает пыль и брызги), за ней два ряда деревьев в
      шахматном порядке -- липа мелколистная и ель колючая, чтобы защита
      работала и зимой. Тротуар проходит за зелёной полосой, а не у дороги.

22_circular_plaza_primer:
  open_area:
    pattern: concentric_rings
    source_quote: >
      Круглая площадь-сквер: в центре -- круглая клумба из гортензии и
      спирей, вокруг неё кольцевая дорожка со скамейками и урнами, четыре
      дорожки-луча ведут от кольца к краю. Посадки идут концентрическими
      кольцами по секторам между лучами: цветущие яблони Недзведцкого и
      черёмуха Маака, кольцо спиреи Вангутта, внешнее кольцо лип и клёнов.
  site_edge:
    pattern: linear_hedge_row
    source_quote: >
      Край круглой площади обрамлён низкой изгородью из кизильника
      блестящего с разрывами у входов-лучей -- площадь читается как
      цельный круг и отделена от окружающих проездов.

23_playground_yard_primer:
  building_border:
    pattern: building_ring
    source_quote: >
      Двор трёх пятиэтажек: вдоль фасадов -- полоса спиреи Вангутта с
      разрывами у каждого подъезда, деревья -- не ближе 5 м к стенам
      (липа и клён с широкой кроной -- не ближе 10 м), чтобы не затенять
      окна первых этажей.
  open_area:
    pattern: poisson_scatter_fill
    source_quote: >
      Детская площадка в центре двора окружена кольцевой дорожкой и
      защитной изгородью из неколючей спиреи японской с разрывами под
      скамейки для родителей. Тень дают деревья, свободно разбросанные по
      двору: берёза повислая, клён остролистный, липа мелколистная; у
      площадки -- только виды без ограничения "не у детских площадок".
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      Дорожки двора связывают каждый подъезд с кольцом вокруг площадки и
      выходом на улицу; вдоль улицы -- двухрядная изгородь из кизильника,
      над теплосетью под западной дорожкой -- только газон.

24_boulevard_primer:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      Бульвар между двумя проездами: центральная прогулочная дорожка 4 м,
      по обе стороны -- аллея лип мелколистных с шагом 8 м, между липами --
      скамейки с урнами и фонари; вдоль тротуаров у проезжих частей --
      двухрядная изгородь из кизильника блестящего от пыли и шума.
      Поперечные дорожки через 60 м связывают тротуары с бульваром.
  site_edge:
    pattern: linear_hedge_row
    source_quote: >
      Край бульвара у проезжей части защищён сплошной стриженой изгородью;
      деревья -- не ближе 2 м к дороге, кусты -- не ближе 1 м.

25_classical_building_ring_primer:
  building_border:
    pattern: building_ring
    source_quote: >
      Девятиэтажный дом в строгом обрамлении: вокруг здания в 7,5 м от стен --
      ровное кольцо туй западных с шагом 3 м, у самого фасада -- низкий
      бордюр из спиреи японской; от каждого из трёх подъездов прямая
      дорожка к главной аллее со скамейками и фонарями.
  site_edge:
    pattern: linear_hedge_row
    source_quote: >
      По всему периметру участка -- двухрядная стриженая живая изгородь из
      кизильника блестящего, за ней вдоль улицы и по бокам -- стройные
      берёзы повислые; с севера, ближе 15 м к дому, крупных деревьев нет.
      Над вводом водопровода и выпуском канализации изгородь прерывается.

26_diagonal_garden_primer:
  open_area:
    pattern: diagonal_rows
    source_quote: >
      Сад диагональных полос: кустарник посажен полосами под 45 градусов,
      каждая полоса -- один вид, всего три вида по кругу -- сирень
      обыкновенная, спирея Вангутта, дерен кроваво-красный. Через каждые
      три полосы -- диагональная дорожка со скамейками и фонарями, в
      остальных промежутках -- ряды берёз повислых.

27_flowing_meadow_primer:
  open_area:
    pattern: flowing_rows
    source_quote: >
      Волновой сад: полосы кустарника в три ряда идут синусоидой (амплитуда
      3,5 м, длина волны 36 м) -- дерен, спирея Вангутта, сирень, спирея
      серая; на гребнях -- рощицы берёз и ели. Две дорожки повторяют волну,
      прямая сквозная дорожка обсажена живой изгородью из спиреи серой.

28_formal_bosque_primer:
  open_area:
    pattern: formal_bosque_grid
    source_quote: >
      Регулярный сад квадратов: дорожки делят участок на девять равных
      квадратов, в центре каждого -- дубовая рощица из пяти дубов
      черешчатых (большой в центре и четыре по диагоналям), под ними --
      гортензия, по краю -- стриженый бордюр из кизильника с туями на
      углах, у дорожек -- скамейки лицом к дубам, на перекрёстках -- фонари.

29_green_parking_primer:
  building_border:
    pattern: building_ring
    source_quote: >
      Дом у озеленённой парковки: у фасада -- низкая полоса спиреи японской
      с разрывами у подъездов, от парковки дом отделяет тротуар и зелёный
      экран.
  site_edge:
    pattern: linear_hedge_row
    source_quote: >
      Боковые границы участка закрыты двухрядной изгородью из кизильника
      блестящего -- парковка не просматривается с соседних дворов.
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      Между парковкой и тротуаром у дома -- двухрядный экран из спиреи
      Вангутта и ряд берёз повислых: кусты закрывают фары и выхлоп от окон
      первых этажей. В рядах машиномест через каждые четыре места --
      островок с деревом (липа или клён).

30_network_corridor_garden_primer:
  open_area:
    pattern: grove_clusters
    source_quote: >
      Сквер над инженерными сетями: наискосок участок пересекают теплосеть и
      водопровод, над ними -- газон и прогулочная дорожка, вдоль коридора --
      двухрядные полосы спиреи Вангутта. По сторонам -- шесть густых рощ в
      три кольца: берёза, лиственница, ель, по краю -- сирень и спирея; по
      краям участка -- ряды лип. Берёзу и лиственницу держат в 4 м от
      теплосети.

# --- Фрагменты улиц с домами и подъездами (tools/primers/street_primers.py) ---

31_street_front_gardens_primer:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      Жилая улица: между проезжей частью и тротуаром -- газонная полоса 4 м
      с рядом лип мелколистных через 8 м (2,3 м от кромки), фонари между
      липами, под тротуаром -- водопровод.
  building_border:
    pattern: building_ring
    source_quote: >
      Перед каждой пятиэтажкой -- палисадник: вдоль тротуара низкий
      кизильник блестящий, глубже -- спирея Вангутта и у самого фасада
      гортензия метельчатая; у подъездов разрывы под дорожки. За домами --
      ряд берёз за нормативным отступом от теплосети.

32_street_shops_primer:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      Торговая улица: широкий тротуар 6 м у витрин первых этажей, вдоль
      проезжей части -- газонная полоса с липами и фонарями, между витринами
      -- низкая спирея японская. Магазины открываются на улицу, жилые
      подъезды -- во двор.
  open_area:
    pattern: grove_clusters
    source_quote: >
      Двор за домом с магазинами: три рощи из лип и клёнов (широкая крона --
      не ближе 10 м к окнам) с сиренью по краю, вдоль дворовой дорожки --
      скамейки с урнами и фонари.

33_street_corner_primer:
  building_border:
    pattern: building_ring
    source_quote: >
      Угловой квартал: Г-образный дом из двух корпусов, подъезды во двор;
      корпуса со стороны улиц и торцов обходит дорожка, по её внешнему
      краю -- живая изгородь из спиреи серой, со двора у фасадов -- низкая
      спирея японская.
  open_area:
    pattern: poisson_scatter_fill
    source_quote: >
      Угол перекрёстка отдан скверу: диагональная дорожка от угла к двору,
      по сторонам -- цветущие яблоня Недзведцкого и черёмуха Маака, куртины
      спиреи Вангутта и скамейки; во дворе -- липы, клёны и ели свободной
      посадкой.
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      Вдоль обеих улиц перекрёстка -- газонная полоса 4 м с рядом лип
      мелколистных через 8 м в 2,3 м от кромки проезжей части; под
      тротуаром -- водопровод, деревья держатся в 2 м от него.

34_street_slab_yard_primer:
  building_border:
    pattern: building_ring
    source_quote: >
      Двенадцатиэтажный дом вдоль улицы: со стороны улицы -- двухрядная
      изгородь из кизильника, подъезды -- во двор, во двор ведут проходы
      у торцов дома.
  open_area:
    pattern: poisson_scatter_fill
    source_quote: >
      Двор за домом: детская площадка в изгороди из неколючей спиреи
      японской со скамейками, вокруг -- берёзы, клёны и липы свободной
      посадкой, вдоль задней границы -- изгородь из кизильника.

35_street_townhouses_primer:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      Малоэтажная улица: вдоль тротуара -- ряд берёз повислых через 10 м,
      фонари между ними; каждый таунхаус отделён от улицы низкой изгородью
      из кизильника с разрывом у калитки.
  building_border:
    pattern: building_ring
    source_quote: >
      У каждого из шести таунхаусов -- свой палисадник: яблоня Недзведцкого
      и туя западная у входа, сирень между домами, за домом -- полоса спиреи
      Бумальда и клён.

36_street_clinic_primer:
  open_area:
    pattern: formal_bosque_grid
    source_quote: >
      Поликлиника со сквером у входа: парадный подход 6 м от улицы к двери,
      вдоль него -- два строгих ряда туй западных, по бокам -- партеры из
      спиреи японской, скамейки лицом к подходу, симметричные фонари; по
      краям участка -- дорожки с сиренью и ряды клёнов и лип.
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      Вдоль улицы у поликлиники -- газонная полоса с рядом клёнов
      остролистных, у боковых фасадов -- спирея серая, за зданием -- ряд лип.

37_street_long_house_primer:
  building_border:
    pattern: building_ring
    source_quote: >
      Длинный шестнадцатиэтажный дом на восемь подъездов: вдоль фасада --
      спирея Вангутта с разрывами у каждого подъезда, тротуар у дома с
      теплосетью под ним.
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      Между улицей и внутриквартальным проездом -- полоса лип через 8 м и
      фонари; парковочные карманы вдоль проезда разделены островками с
      деревом (липа или клён).
  site_edge:
    pattern: linear_hedge_row
    source_quote: >
      За домом -- ряд берёз повислых и изгородь из кизильника вдоль задней
      границы участка.

38_street_median_primer:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      Улица с разделительной полосой: по оси -- липы мелколистные через 8 м
      с куртинами спиреи японской между ними и фонарями, по обе стороны --
      тротуары с водопроводом и кабелем связи под ними.
  building_border:
    pattern: building_ring
    source_quote: >
      Дома по обе стороны улицы с подъездами на улицу; перед каждым --
      палисадник из кизильника вдоль тротуара и гортензии метельчатой у
      фасада, за домами -- ряды берёз.

39_street_bike_lane_primer:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      Улица с велодорожкой: у проезжей части -- ряд лип, за ним велодорожка,
      затем полоса низкой спиреи японской, отделяющая велосипедистов от
      пешеходов, и тротуар.
  building_border:
    pattern: building_ring
    source_quote: >
      Пятиэтажки с подъездами на улицу: палисадники из кизильника и
      гортензии, у каждого подъезда -- велопарковка, за домами -- берёзы и
      дерен кроваво-красный.

40_street_cul_de_sac_primer:
  building_border:
    pattern: building_ring
    source_quote: >
      Тупиковая улица: три дома вокруг разворотной площадки, подъезды
      обращены к ней, вдоль фасадов -- спирея Вангутта; въезд обсажен
      клёнами остролистными с фонарями между ними.
  open_area:
    pattern: grove_clusters
    source_quote: >
      Южные участки у въезда -- рощи: ель колючая в центре, вокруг берёзы и
      лиственницы, с юга -- сирень; вдоль боковых границ -- изгородь из
      кизильника блестящего.
