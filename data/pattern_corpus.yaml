# Retrieval-корпус для GreenPlan, Этап 3 (issue #23).
#
# По каждому из 9 реальных, документированных проектов в locations/ -- какой
# паттерн из backend/pattern_library.py применён в каком виде геометрической
# зоны (zone_partitioning.ZoneKind), и цитата/пересказ из соответствующего
# locations/<slug>/design_rationale.md, откуда это взято. Это НЕ полный
# корпус из 20 проектов, упомянутый в issue #23 -- тот восстанавливает другой
# разработчик отдельно и в репозитории пока не появился (см.
# backend/pattern_corpus.py). Здесь честно 14 проектов, у которых уже есть и
# реальный DXF, и разобранная документация (9 из первой серии + 5 из
# ветки new-convert).
#
# Проект без художественной концепции (11_frunzenskaya_naberezhnaya) размечен
# паттерном generic_fill, а не пропущен -- иначе retrieval для будущего
# похожего "чисто технического" участка вообще не нашёл бы соседа и
# выдумывал бы отсутствующее сходство с художественными проектами.

02_peschany_pereulok:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      "Размещение кустарников между проезжей частью и пешеходными зонами
      создаёт дополнительный защитный барьер" -- буферная полоса 4 м вдоль
      дороги (снежноягодник Доренбоза, спирея серая Grefsheim, кизильник
      блестящий -- роза морщинистая исключена как инвазивный вид 369-ПП),
      кусты с шагом 1.4 м, деревья (липа мелколистная) с шагом 12 м.
  building_border:
    pattern: building_ring
    source_quote: >
      Кольцо кустов (снежноягодник) вокруг каждого здания в пределах
      50-метровой полосы у дороги/дорожек -- 18 из 30 зданий, 1241 куст;
      остальные 12 физически не связаны с улицей дорогой/дорожкой.

06_kamchatskaya_ulitsa:
  open_area:
    pattern: diagonal_rows
    source_quote: >
      "В основу проекта положена система четких диагональных линий
      озеленения, ориентированных под углом к проезжей части и пешеходным
      дорожкам" -- диагонали внутри очищенных зон газона, группы кустов и
      многолетников вдоль каждой линии (спирея серая, дёрен белый, дёрен
      отпрысковый, мискантус китайский).

07_nizhnie_polya:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      "Использование полос и ритма в оформлении улицы" (буферная
      функциональная зона профиля) -- полоса вдоль дороги (ива ломкая
      Буллата, спирея серая, пузыреплодник калинолистный, лапчатка
      кустарниковая, деревья -- клён остролистный/Гиннала), после починки
      сетей (electrical keepout был больше площади участка) -- 2090
      кустов, 127 деревьев.

10_stary_gay:
  open_area:
    pattern: flowing_rows
    source_quote: >
      "Формы живых изгородей словно напоминают краски, стекающие со
      склонов к тротуарам и проезжей части" -- волнистые линии
      (синус-модуляция, амплитуда 4 м, длина волны 40 м), двурядная
      изгородь на 3 из 4 линий (барбарис Тунберга, туя западная,
      можжевельник, калина обыкновенная).

11_frunzenskaya_naberezhnaya:
  open_area:
    pattern: generic_fill
    source_quote: >
      В записке нет художественной концепции вообще -- чисто техническое
      благоустройство (посадка взамен вырубаемых по санитарному
      состоянию, компенсационные мероприятия), без таблицы видов и без
      признаков, отличающих один вид доозеленения от другого.
  path_corridor:
    pattern: generic_fill
    source_quote: >
      Та же причина, что и для open_area этого проекта: нет данных для
      геометрического паттерна, использован обычный равномерный генератор.

12_natashinsky_proezd:
  open_area:
    pattern: grove_clusters
    source_quote: >
      "Групповые посадки кустарников, формирующие орнаментальные
      композиции, вдохновлённые русскими народными узорами" (образ
      русского пейзажа) -- 25 роще по 3-7 деревьев (липа, тополь, клён,
      яблоня, сосна) + 30 пятен декоративных злаков по 10-20 растений.

13_kharkovsky_proezd:
  open_area:
    pattern: grove_clusters
    source_quote: >
      "Образ русского пейзажа... рощи, хвойные массивы, поля со злаками,
      извилистые берега" -- 6 роще по 2-4 дерева (сосна/ель/берёза), 10
      рыхлых пятен злаков по 6-14 растений (вейник, мискантус, молиния).

19_2ya_pryadilnaya:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      Живые изгороди по реальной ведомости посадочного материала (таблицы
      7-8): барбарис Тунберга 12 шт/пог.м, кизильник блестящий 12
      шт/пог.м, пузыреплодник Лютеус 5 шт/пог.м -- вдоль полосы у дороги
      (3.5 м), реальная погонная плотность сохранена.
  open_area:
    pattern: grove_clusters
    source_quote: >
      Таблица 7 ведомости отмечает "группы" в примечании для каждого вида
      дерева -- несколько случайных центров, вокруг каждого группа из 2-4
      деревьев ОДНОГО вида (липа крупнолистная доминирует, 161 из 263).

04_kharkovskaya_ulitsa:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      "Основой композиции являются протяженные массивы посадок кустарников
      одного вида с формируемой кроной" (бионический стиль, из
      `data/ПЗ Харьковская улица.docx`) -- 9 видов кустарника, у каждого
      свой контур группы вдоль улицы, плюс акцентная группа декоративных
      яблонь (47 шт.) для сезонной декоративности.

05_bagritskogo_ulitsa:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      "Создания зеленых буферных зон (плотных многорядных посадок) вдоль
      проезжих частей" и "устройство двурядной стриженной живой изгороди"
      (`data/Раздел 1.1_ПЗ (пояснительная записка).pdf`) -- 15 видов новых
      кустарников точками вдоль улицы 1.6 км, крупнейшие группы: спирея
      японская 'Darts Red' (699), спирея Вангутта (397).

08_lodochnaya:
  path_corridor:
    pattern: generic_fill
    source_quote: >
      Источник (`07_Л_ПВ`) -- перечётная ведомость существующих деревьев,
      не записка с концепцией: 628 "Сохранить" из 1090 обследованных.
      Новая посадка по проекту минимальна (7 лип, 31 куст сирени) --
      стратегия участка это сохранение существующего каркаса, а не
      художественный приём для новой посадки, размечать нечего.

09_izmaylovskaya_ploshad:
  open_area:
    pattern: grove_clusters
    source_quote: >
      Реальный дендроплан (не текст записки -- та описывает лишь узкий
      раздел на 9 деревьев компенсационной посадки, см.
      design_rationale.md): 1930 новых кустов по 11 видам крупными
      однородными группами (можжевельник казацкий 378, лапчатка 297,
      спирея серая 259) на открытой площади -- классифицировано по составу
      (крупные однопородные группы, не строчная посадка), текстового
      описания приёма расстановки в источниках нет.

17_gruzinskaya_m:
  path_corridor:
    pattern: generic_fill
    source_quote: >
      Источник (`10001169-ООС2`) -- раздел "Охрана окружающей среды"
      (география/климат/геология участка), не записка по озеленению;
      единственная проектная посадка по нему -- 9 клёнов Гиннала
      компенсационно. Богатый дендроплан сцены (3614 деревьев, 619 кустов,
      см. design_rationale.md) взят из отдельных посадочных DWG без
      текстового описания приёма расстановки -- размечать конкретным
      геометрическим паттерном нечестно, использован generic_fill.

20_makeeva_s:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      "Посадки подчёркивают линейную перспективу улицы и усиливают
      ощущение глубины пространства" -- буферная полоса 15 м вдоль дороги
      (можжевельник скальный, клён сахаристый, берёза полезная, черёмуха
      Шуберт).
  building_border:
    pattern: building_ring
    source_quote: >
      Кольцо можжевельника скального вокруг каждого из 88 зданий (2939
      кустов) -- буферная полоса вдоль дороги в принципе не покрывала
      дворы вдали от проезжей части.
  open_area:
    pattern: poisson_scatter_fill
    source_quote: >
      "Создание ярусности посадок в уже существующих ландшафтах" --
      редкий разброс по всей пригодной площади участка, не только у
      дороги, Пуассон-подобная выборка с шагом 6/12 м (1183 куста + 269
      деревьев).

# --- Синтетические эталонные участки (green-city-locations-primer-spec.md) --
# см. докстринг backend/pattern_corpus.py про суффикс "_primer". У этих
# записей source_quote цитирует не проектную документацию (её не
# существует), а design_rationale.md самого синтетического участка.

21_road_buffer_primer:
  path_corridor:
    pattern: linear_hedge_row
    source_quote: >
      Синтетический эталон (не реальный проект, см. design_rationale.md):
      участок 22x95 м с дорогой вдоль одной стороны, буфер в два яруса --
      7 деревьев с шагом ~12 м (лёгкий джиттер, не механическая сетка) +
      сплошной кустарник с шагом ~1.5 м. Прямой геометрический аналог
      linear_hedge_row из 02_peschany_pereulok, построенный как чистый
      учебный пример этого паттерна без посторонних зданий/сетей.

22_circular_plaza_primer:
  site_edge:
    pattern: linear_hedge_row
    source_quote: >
      Синтетический эталон (не реальный проект, см. design_rationale.md):
      круглая площадь радиусом 18 м, живая изгородь кольцом по всему
      периметру (9 деревьев + 27 кустов на кольце в 1.5 м от границы).
      Geometрический аналог linear_hedge_row, применённый к site_edge
      компактного участка вместо вытянутой полосы вдоль улицы -- первый
      пример в корпусе, где centerline_of() строит осевую линию не вдоль
      прямой, а по кругу.

23_triangular_plot_primer:
  site_edge:
    pattern: linear_hedge_row
    source_quote: >
      Синтетический эталон (не реальный проект, см. design_rationale.md):
      неравносторонний треугольный остаточный участок, живая изгородь
      кольцом вдоль всех трёх сторон (23 дерева/куста на кольце + 44
      куста), плюс акцентная группа из 3 деревьев в центре (open_area) --
      единственный в корпусе пример акцентной посадки в open_area
      компактного (не вытянутого) участка.

24_hexagon_courtyard_primer:
  site_edge:
    pattern: linear_hedge_row
    source_quote: >
      Синтетический эталон (не реальный проект, см. design_rationale.md):
      правильный шестиугольный двор (вписан в окружность радиусом 20 м),
      живая изгородь кольцом вдоль всех 6 сторон (20 деревьев + 40
      кустов). Третий из трёх "дизайнерских" по форме эталонов (круг,
      треугольник, шестигранник) -- проверяет тот же паттерн на форме с
      прямыми углами 120°, без сглаживания круга и без острых углов
      треугольника.

25_classical_building_ring_primer:
  building_border:
    pattern: building_ring
    source_quote: >
      Не выдумано -- пересказ реального текста из документации проекта
      "1. Олимпийская деревня" (Датасет/Пилотный проект 20 улиц/.../1.
      Олимпийская деревня/Проектное решение/Раздел 1.1-ПЗ.pdf, раздел 4):
      "Идея проекта озеленения основана на классическом визуальном образе
      архитектуры... строгая регулярная расстановка растения, подчинение
      главному зданию -- доминанте... живые изгороди... как отличительные
      приемы классического стиля" + раздел 5.1 п.3 "Устройство двурядной
      стриженной живой изгороди из кустарников". Геометрия: здание
      30x18 м в центре участка 60x45 м, два кольца кустов (отступ 5.3 и
      6.5 м, шаг 1.2 м) + редкое кольцо акцентных деревьев (отступ 7.6 м,
      шаг 6 м) -- первый пример двурядного строгого регулярного кольца в
      корпусе (02_peschany_pereulok/20_makeeva_s документируют только
      однорядные кольца).

# --- Придуманные (не из реального документа) синтетические эталоны --
# по прямой просьбе пользователя: "попробуй сам придумать описание для
# дизайнерских решений". См. design_rationale.md каждого участка -- честно
# помечено, что концепция сочинена, а не пересказана из ПСД.

26_diagonal_garden_primer:
  open_area:
    pattern: diagonal_rows
    source_quote: >
      Синтетический эталон, концепция придумана (не реальный проект, см.
      design_rationale.md): "Диагональный сад" -- прямоугольный двор
      50x36 м, ряды кустарника под 45° к сторонам с шагом 4 м между
      линиями (210 кустов на 21 линии) + 11 акцентных деревьев в центре
      самых длинных линий. Второй пример diagonal_rows в корпусе --
      06_kamchatskaya_ulitsa был единственным документированным реальным
      проектом с этим паттерном.

27_flowing_meadow_primer:
  open_area:
    pattern: flowing_rows
    source_quote: >
      Синтетический эталон, концепция придумана (не реальный проект, см.
      design_rationale.md): "Волнистый луг" -- открытый газон 70x50 м, три
      параллельные волнистые линии (амплитуда 4 м, длина волны 40 м --
      буквально параметры flowing_rows из pattern_library.py, взятые из
      10_stary_gay), две линии двурядные (255 кустов), третья -- редкие
      акцентные деревья (9 шт.) вместо второго ряда. Второй пример
      flowing_rows в корпусе -- 10_stary_gay был единственным
      документированным реальным проектом с этим паттерном.

# --- Формальный боскет -- совсем новый паттерн (не вариация существующего) --
# добавлен, чтобы retrieval для open_area не выпадал стабильно только в
# органичные (grove_clusters) или волнистые (flowing_rows) приёмы. Источник
# концепции: реальный термин ландшафтной архитектуры (см. design_rationale.md
# участка и Wikipedia "Avenue (landscape)"), не выдуман с нуля.

28_formal_bosque_primer:
  open_area:
    pattern: formal_bosque_grid
    source_quote: >
      Синтетический эталон, концепция -- реальный термин ландшафтной
      архитектуры "боскет" (см. design_rationale.md): квадратная площадь
      48x48 м, строгая ортогональная сетка деревьев с шагом 6x6 м (49
      деревьев), без единого куста -- открытое пространство под регулярным
      пологом крон, геометрическая противоположность и органичным
      grove_clusters, и волнистым flowing_rows. Первый и пока единственный
      пример formal_bosque_grid в корпусе.

# --- Ещё два новых паттерна -- по прямой просьбе пользователя добавить
# другие формы (не только волны), сам выбор -- реальные, не выдуманные
# приёмы: концентрические кольца (общественные площади/парки) и треугольная
# (гексагональная, квинкункс) сетка (садоводство/orchard-планирование).

29_concentric_rings_primer:
  open_area:
    pattern: concentric_rings
    source_quote: >
      Синтетический эталон, концепция -- реальный приём ландшафтной
      архитектуры (см. design_rationale.md, "Birch trees planted
      concentrically around a basin", landezine.com/circles-disks-and-rings):
      квадратная площадь 60x60 м, несколько вложенных колец вокруг центра
      (воображаемый фонтан/клумба) с шагом радиуса 6 м -- чётные кольца
      деревья (51 шт.), нечётные кольца кусты (141 шт.). Первый и пока
      единственный пример concentric_rings в корпусе.

30_triangular_grid_primer:
  open_area:
    pattern: triangular_grid_fill
    source_quote: >
      Синтетический эталон, концепция -- реальный приём orchard-планирования
      "квинкункс"/треугольная посадка (см. design_rationale.md,
      cropsreview.com/planting-patterns): прямоугольная площадь 42x36 м,
      треугольная (гексагональная) решётка -- 36 деревьев с шагом 6 м, 127
      кустов с шагом 3 м, ряды через один смещены на полшага. Первый и пока
      единственный пример triangular_grid_fill в корпусе.
