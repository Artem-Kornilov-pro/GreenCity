# Продакшен-режим поверх docker-compose.yml (дев-режим остаётся как есть):
#
#     make docker-prod-up
#     # = docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# Рассчитан на сервер 4 vCPU (2 ГГц) / 8 ГБ ОЗУ / 40 ГБ SSD. Бюджет памяти:
#   backend 3 ГБ (3 процесса, до ~750 МиБ каждый на крупном участке)
#   + mongo 1 ГБ + redis 256 МБ + frontend 128 МБ
#   + мониторинг ~0,6 ГБ + система и Docker ~0,8 ГБ  =  ~5,8 ГБ,
#   остальное -- запас и файловый кеш.
# CPU: backend -- 3 ядра (тяжёлый запрос занимает одно ядро на 2-30 с при
# 2 ГГц), четвёртое -- mongo, nginx, мониторинг и система, чтобы сайт
# отвечал, пока все три процесса считают GreenPlan.
#
# Что меняется относительно дев-режима:
#   - frontend: статическая сборка за nginx (frontend/Dockerfile.prod) на
#     порту 80 вместо vite dev server на 5173; /api/ nginx проксирует на
#     бэкенд -- сайт и API на одном адресе;
#   - backend: код из образа, без смонтированных каталогов и без --reload,
#     UVICORN_WORKERS процессов (3); наружу не открыт, только через nginx;
#   - mongo: кеш WiredTiger 0,5 ГБ (по умолчанию -- половина ОЗУ сервера);
#   - логи контейнеров ограничены (3 файла по 10 МБ на сервис) -- Docker по
#     умолчанию хранит их без предела, на 40 ГБ диска за недели это заметно.
# Мониторинг (Prometheus, Loki, Promtail, Grafana) -- без изменений.

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  backend:
    volumes: !reset []
    ports: !reset []
    environment:
      - UVICORN_WORKERS=${UVICORN_WORKERS:-3}
      - UVICORN_RELOAD=0
      # uvicorn раз в несколько секунд опрашивает рабочие процессы и убивает
      # не ответивший за 5 с (по умолчанию) -- посреди тяжёлого запроса это
      # давало 502. 120 с -- с запасом на самый долгий блокирующий шаг.
      - UVICORN_TIMEOUT_WORKER_HEALTHCHECK=120
      # Пачек DWG одновременно (backend/exchange/dwg_job.py): одна -- до
      # ~1,8 ГБ в пике, при mem_limit 3g безопасна одна.
      - DWG_MAX_PARALLEL=${DWG_MAX_PARALLEL:-1}
    cpus: 3.0
    mem_limit: 3g
    logging: *logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    volumes: !reset []
    environment: !reset []
    ports: !override
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    mem_limit: 128m
    logging: *logging

  mongo:
    command: ["--wiredTigerCacheSizeGB", "0.5"]
    mem_limit: 1g
    logging: *logging

  redis:
    mem_limit: 256m
    logging: *logging
